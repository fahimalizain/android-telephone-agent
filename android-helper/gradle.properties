org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Gradle 8.14.6 does not support the JDK 25 bundled with this machine's Android
# Studio. Pin the installed JDK 21 so both the CLI and IDE use a supported JVM.
# Change or remove this line on a machine with a different JDK layout.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
android.nonTransitiveRClass=true
kotlin.code.style=official
