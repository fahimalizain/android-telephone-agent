name: Bug report
description: Report a reproducible defect in documentation, scripts, the reference runtime, or hardware behavior.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        This project is at alpha, design stage, so some behavior is expected to be
        incomplete. Please describe what you actually observed rather than what you
        expected from the design.

        Do not include phone numbers, SIM identifiers, IMEI numbers, API keys, helper
        tokens, Wi-Fi credentials, or other personal data. Redact logs before pasting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A concise description of the problem and when it occurs.
      placeholder: Describe the failure and any error message you saw.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that reliably reproduces the problem.
      placeholder: |
        1. Pair Phone A with the Linux host and enable Calls and audio.
        2. Place a call and run scripts/bluetooth-check.sh.
        3. ...
    validations:
      required: true
  - type: input
    id: recent-changes
    attributes:
      label: What changed recently
      description: List anything that changed before the problem appeared, such as an OS update, a different Bluetooth adapter, or a configuration edit.
      placeholder: Updated BlueZ or PipeWire, changed the Bluetooth adapter, rotated the helper token
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen, and why?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include exact error text where possible.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Choose the part of the project closest to the problem.
      options:
        - Documentation
        - Bluetooth HFP link or SCO audio
        - Android setup or helper app
        - Dialing and call control
        - Inbound answering
        - Voice agent runtime
        - Scripts and systemd
        - Other
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Phone model and region, Linux host, Bluetooth adapter, and charger.
      placeholder: Samsung Galaxy A23 4G (SM-A235F), Ubuntu laptop, onboard Bluetooth
  - type: input
    id: software
    attributes:
      label: Software and OS
      description: Android version and vendor build, Linux distribution, kernel, BlueZ, PipeWire, WirePlumber, and the commit or release you tested.
      placeholder: Android 14 / One UI 6.x, Ubuntu 24.04, BlueZ 5.85, PipeWire 1.6.2, commit abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant excerpt. Remove identifiers and credentials.
      render: shell
      placeholder: |
        $ bluetoothctl info AA:BB:CC:DD:EE:FF
        $ ./scripts/bluetooth-check.sh AA:BB:CC:DD:EE:FF
        $ journalctl --user -u telephone-agent-bluetooth.service -n 100
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed phone numbers, SIM identifiers, IMEI numbers, tokens, and other personal data from this report.
          required: true
        - label: I can reproduce this on the latest commit or the latest release.
          required: false
