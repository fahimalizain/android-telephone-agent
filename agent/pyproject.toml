[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telephone-agent"
version = "0.1.0"
description = "Reference runtime for the android-telephone-agent outbound voice call agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "android-telephone-agent contributors" }]
keywords = ["telephony", "raspberry-pi", "usb-gadget", "voice-agent", "alsa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
  "Topic :: Communications :: Telephony",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
telephone-agent = "telephone_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["telephone_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["telephone_agent", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
