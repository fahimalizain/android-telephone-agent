# Reference configuration for the telephone agent.
#
# Copy this file to config/config.toml (or a path passed with --config) and
# replace every placeholder. Never commit a populated file: phone numbers,
# helper tokens, and provider API keys are secrets.
#
# Precedence is: dataclass defaults < this file < environment variables.
# Environment overrides use TELEPHONE_AGENT_* with a double underscore between
# section and key, for example TELEPHONE_AGENT_DIALER__TOKEN. Environment
# values win, so the token here can be a harmless placeholder.

# Destination in E.164 format. Optional when every dial/run invocation passes
# --number. This is the fictional +1 555-555-0100 range.
phone_number = "+15555550100"

[audio]
# Transport: "alsa" is the USB Audio Class gadget (default); "pipewire" is a
# Bluetooth HFP headset link. The USB path needs card/device. The Bluetooth path
# needs bluetooth_address and a host running PipeWire/WirePlumber. See
# docs/bluetooth-hfp.md.
backend = "alsa"

# USB gadget settings (backend = "alsa"). This is the ALSA card id, not the
# bracketed description. `arecord -l` prints a line such as:
#   card 0: UAC1Gadget [USB Audio], device 0: USB Audio [USB Audio]
# In that example the card id is "UAC1Gadget". Verify the value on your device.
card = "UAC1Gadget"
device = 0

# Bluetooth HFP settings (backend = "pipewire"). Set the phone's Bluetooth
# address, for example "AA:BB:CC:DD:EE:FF". The SCO audio nodes exist only while
# a call is active, so the runtime waits up to node_timeout_s for them.
bluetooth_address = ""
node_timeout_s = 30.0

# The gadget itself runs at 48 kHz stereo and the Bluetooth SCO link is 8 kHz
# (CVSD) or 16 kHz (mSBC). The ALSA/PipeWire layers resample and downmix to this
# processing format, which is enough for the cellular codec.
sample_rate = 16000
channels = 1
frame_ms = 20

[dialer]
# Base URL of the helper app on Phone A. Keep it on the LAN; do not port-forward.
# Placeholder address and port.
url = "http://192.168.1.20:8765"
# Bearer token required by the helper. Prefer TELEPHONE_AGENT_DIALER__TOKEN over
# storing a real token in this file.
token = "replace-with-helper-token"
timeout_s = 10.0
# Retries apply only to HTTP 5xx and connection failures, never to 4xx.
# Bounded to 5.
retries = 2

[brain]
# "echo" returns a short echo and is intended for loopback testing.
# "http" targets any OpenAI-compatible /chat/completions endpoint.
kind = "echo"

# "text" for a plain reply brain; "json" for an HTTP brain that can consult the
# requester mid-call. "json" requires kind = "http".
# action_mode = "text"

# The fields below are used only when kind = "http". Point base_url at the API
# root, up to and including /v1. The client appends /chat/completions.
base_url = "https://api.example.invalid/v1"
api_key = "replace-with-api-key"
model = "replace-with-model"
system_prompt = """You are a concise voice assistant on a telephone call.
Reply in one or two short sentences, in plain spoken language.
Do not use markdown, lists, or stage directions."""
max_tokens = 200
timeout_s = 30.0

[realtime]
# "off" keeps the text pipeline above. "grok" selects xAI's full-duplex
# speech-to-speech WebSocket API, which replaces the STT, LLM, and TTS stages
# with one session. The adapter is independent: it does not use [brain] or the
# Transcriber/Synthesizer seams.
kind = "off"

# WebSocket endpoint without the model query parameter. The adapter appends
# ?model=<model>.
base_url = "wss://api.x.ai/v1/realtime"

# Prefer the XAI_API_KEY environment variable, or a systemd EnvironmentFile
# outside the repository. Do not commit a key here. A TELEPHONE_AGENT_REALTIME__
# API_KEY override also works.
# api_key = ""

# Realtime model and built-in voice id.
model = "grok-voice-latest"
voice = "eve"

# Optional system prompt. Empty uses the adapter's concise telephone prompt.
instructions = ""

# Optional BCP-47 transcription hint, for example "en-IN". The adapter passes it
# to Grok's input transcription; unsupported codes fall back to auto-detection.
# Malayalam is not in xAI's documented realtime language list as of 2026-10.
language = ""

# "none" minimizes latency; "high" enables model reasoning.
reasoning_effort = "none"

# Server-side VAD. threshold is a speech probability between 0 and 1, unlike
# agent.vad_threshold, which is dBFS for the local energy detector.
vad_threshold = 0.5
prefix_padding_ms = 300
silence_duration_ms = 500

# Let the server re-engage after this much silence. 0 disables it and leaves
# silence handling to agent.silence_timeout_s.
idle_timeout_ms = 0

[agent]
# Reserved for an external scheduler (systemd timer, cron, or a future
# controller). The reference runtime does not schedule calls itself.
schedule = ""
max_call_seconds = 300
# Hang up after this much continuous silence with no active utterance. Ringing
# time also counts because v0 has no answer detection.
silence_timeout_s = 20.0
# dBFS. Frames at or below this level are silence. Tune this in the room where
# the Pi and Phone A will operate; -40 is a starting point, not a guarantee.
vad_threshold = -40.0
# BCP-47 tag used to label the call and passed to future speech adapters.
language = "en-IN"
# The holding phrase is spoken before the call pauses for the requester's
# answer; the timeout bounds that pause. Keep both short enough that the callee
# is not left in silence.
consult_timeout_s = 8.0
holding_phrase = "One moment please."

[server]
# Control-plane listeners shared by the MCP and A2A adapters. Both bind to
# loopback by default; use a private LAN address only when another host must
# connect. Do not port-forward this listener or enable UPnP.
host = "127.0.0.1"
# MCP Streamable HTTP port.
port = 8765
# A2A JSON-RPC port.
a2a_port = 8766
# Bearer token required by both listeners on every route except /health. A
# token must be at least 8 characters and is required to run `serve`; the
# command refuses to start without it. Prefer
# TELEPHONE_AGENT_SERVER__TOKEN over storing a real token in this file, and
# never log the token or put it in a URL.
token = "replace-with-server-token"
# External base URL used in the A2A Agent Card, for example
# "https://agent.example.com". Leave empty for direct loopback use.
public_url = ""
# Optional append-only JSONL path for CallService task events. Leave empty to
# disable the audit log. Transcripts are personal data; apply a retention rule.
audit_log = ""
