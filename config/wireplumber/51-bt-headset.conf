# Make this Linux host an HFP Hands-Free (HF) headset for Phone A.
#
# In this direction Phone A is the Audio Gateway (AG). The host offers the
# headset side of HFP/HSP so PipeWire creates SCO nodes for call audio. The
# roles below also keep A2DP sink available for ordinary media playback.
#
# This is a per-user WirePlumber drop-in. Install it as:
#   ${XDG_CONFIG_HOME:-$HOME/.config}/wireplumber/wireplumber.conf.d/51-bt-headset.conf
# Then restart the user service:
#   systemctl --user restart wireplumber
#
# SCO nodes exist only while a call is active. The adapter should advertise
# Headset (UUID 0x1108) and Handsfree (UUID 0x111e) after WirePlumber restarts.
monitor.bluez.properties = {
  bluez5.roles = [ hfp_hf hsp_hs a2dp_sink ]
  bluez5.hfphsp-backend = native
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}

# Keep WirePlumber's linking policy off the call-scoped SCO nodes.
#
# The SCO source and sink are session items with node.autoconnect = true, so
# during a call WirePlumber links them to the default devices: the remote
# party's voice plays out of this host's speakers, and this host's microphone
# is mixed into the uplink. The callee then hears the room around the host in
# addition to whatever the agent plays.
#
# The agent links to these nodes explicitly (pw-record --target / pw-play
# --target), so they need no default routing of their own. Setting
# node.autoconnect = false leaves both directions empty until the agent opens
# them, which is what a hands-free bridge wants.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_input.*" }
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        node.autoconnect = false
      }
    }
  }
]
